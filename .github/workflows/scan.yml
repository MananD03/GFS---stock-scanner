name: Morning V-Shape Scanner

on:
  schedule:
    # 9:16 AM IST = 3:46 AM UTC. Runs Mon-Fri only.
    - cron: "46 3 * * 1-5"
  workflow_dispatch: {}   # lets you trigger manually to test

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py
