name: V-Shape Squeeze Scanner

on:
  schedule:
    # 2:45 PM IST = 9:15 AM UTC. Runs Mon-Fri only. github is often 5-20 min late so it lands roughly 2:45-3:05
    - cron: "15 9 * * 1-5"
  workflow_dispatch: {}   # lets you trigger manually to test

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pandas numpy pyotp growwapi

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
        run: python scan.py
